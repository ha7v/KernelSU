name: Sync Upstream & Build

on:
  schedule:
    # 每天每 6 小时自动检查并追新上游
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force trigger build even if already up to date'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream, apply customizations, and trigger build
        id: sync
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/tiann/KernelSU.git 2>/dev/null || true
          git fetch upstream main

          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          echo "Upstream HEAD: $UPSTREAM_HEAD"

          if git merge-base --is-ancestor upstream/main HEAD; then
            UPSTREAM_UPDATED="false"
            echo "Current branch already contains all commits from upstream/main."
          else
            UPSTREAM_UPDATED="true"
            echo "New upstream commits detected!"
          fi

          FORCE_BUILD="${{ inputs.force_build }}"

          if [ "$UPSTREAM_UPDATED" = "false" ] && [ "$FORCE_BUILD" != "true" ]; then
            echo "Already up-to-date with upstream/main and force_build is not requested. Done."
            exit 0
          fi

          if [ "$UPSTREAM_UPDATED" = "true" ]; then
            echo "Merging upstream/main ($UPSTREAM_HEAD) into current branch..."
            if ! git merge upstream/main -m "sync: Merge upstream/main ($UPSTREAM_HEAD)"; then
              echo "Merge conflict encountered, resolving conflict files with upstream and re-applying customizations..."
              git checkout --theirs kernel/Kbuild manager/app/build.gradle.kts manager/build.gradle.kts userspace/ksud/build.rs 2>/dev/null || true
            fi

            echo "Applying fork identity customizations..."
            python3 .github/scripts/apply-fork-identity.py

            git add -A
            if [ -f ".git/MERGE_HEAD" ]; then
              git commit --no-edit || git commit -m "sync: Merge upstream/main and apply fork identity"
            elif git status --porcelain | grep -q .; then
              git commit -m "manager: Set fork identity defaults"
            fi

            echo "Pushing updated branch to origin..."
            git push origin main
            echo "Branch pushed successfully."
          fi

          echo "Triggering Build Manager workflow..."
          gh workflow run build-manager.yml --ref main
          echo "Build Manager workflow dispatched successfully."
